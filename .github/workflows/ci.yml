name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # 引擎子模块 third_party/video_ocr_engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install -e third_party/video_ocr_engine --no-deps  # 引擎源码已在子模块；numpy 由本项目依赖带
      - name: Run unit tests (no video / no decord / no GPU)
        run: python -m pytest tests/ -v
        env:
          PYTHONIOENCODING: utf-8  # 中文 skip reason 在 GBK 控制台崩溃
