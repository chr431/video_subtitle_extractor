name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    # 仅 Windows：本地开发与发布都以 Windows 为准；Linux runner 装 Qt 系统
    # 依赖（libEGL/libGL/xkbcommon）+ PySide6 安装过慢，放弃。
    runs-on: windows-latest
    steps:
      # 引擎 video_ocr_engine 已 pip 化：版本由 pyproject.toml 的 git tag
      # 锁定，随 `pip install -e ".[dev]"` 一并安装，无需 submodule checkout。
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run unit tests (no video / no decord / no GPU)
        run: python -m pytest tests/ -v
        env:
          PYTHONIOENCODING: utf-8  # 中文 skip reason 在 GBK 控制台崩溃
