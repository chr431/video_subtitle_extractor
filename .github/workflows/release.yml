# video_subtitle_extractor 发布工作流 — 从指定分支一键构建并发布 GitHub Release
#
# 手动触发（Actions → Release → Run workflow，默认 ref: main）即完成：
#   1. 读取 pyproject.toml 的 version（单一事实源），确认 tag v<版本> 不存在
#   2. scripts/setup.ps1 + scripts/build_exe.ps1 构建 frozen exe
#   3. 打包 VideoSubtitleExtractor.<版本>.7z（7-Zip LZMA2 mx=9 最大压缩；
#      exe 位于 7z 根 + _internal/，与 dist 布局一致）
#   4. 打 tag v<版本> + push，创建 GitHub Release（notes 取自 release_notes.md 对应节）
#
# 只监听 workflow_dispatch（push/tag 不会二次触发）。构建失败时不产生 commit/tag/release。

name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to release from'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read version + check tag
        id: ver
        shell: pwsh
        run: |
          $ver = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if (-not $ver) { Write-Error "读取版本失败"; exit 1 }
          Write-Host "Releasing version: $ver"
          if (git tag -l "v$ver" | Select-String -Quiet "v$ver") {
            Write-Error "tag v$ver 已存在"
            exit 1
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=v$ver"

      - name: Setup venv + deps
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build EXE
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_exe.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($e in @("dist/VideoSubtitleExtractor/VideoSubtitleExtractor.exe",
                           "dist/VideoSubtitleExtractor/subtitle-extract.exe")) {
            if (-not (Test-Path $e)) { Write-Error "缺少产物入口: $e"; exit 1 }
          }

      - name: Smoke check CLI exe (frozen, CPU backend, no GPU needed)
        # 构建成功 ≠ 产物可用：本步骤在打 tag/发布**之前**真实运行 frozen CLI，
        # 把"CLI 没被打进产物 / 打包遗漏导致 import 失败 / 引擎或模型资产没随包"
        # 这类回归拦在发布前（0.2.1 及更早的产物只有 GUI exe，CLI 完全缺席）。
        # 失败不产生 tag/release。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "_smoke" | Out-Null
          # windows runner 不保证预装 ffmpeg：PATH 缺失时用 imageio-ffmpeg 兜底
          $ff = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (-not $ff) {
            python -m pip install -q imageio-ffmpeg
            $ff = (python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())").Trim()
          }
          & $ff -y -loglevel error -f lavfi `
            -i "testsrc=duration=2:size=640x360:rate=30" `
            -c:v libx264 -pix_fmt yuv420p "_smoke\input.mp4"
          if (-not (Test-Path "_smoke\input.mp4")) {
            Write-Error "ffmpeg 合成测试视频失败"; exit 1
          }
          # console=True：pwsh 的 & 会等待进程并捕获输出/退出码
          & "dist\VideoSubtitleExtractor\subtitle-extract.exe" `
            "_smoke\input.mp4" --roi 20 20 300 80 --start-frame 0 --end-frame 40 `
            --decode-backend cpu --ocr-backend cpu -o "_smoke\out.csv"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "frozen CLI 冒烟运行失败（exit $LASTEXITCODE）"; exit 1
          }
          if (-not (Test-Path "_smoke\out.csv")) {
            Write-Error "frozen CLI 未生成 CSV"; exit 1
          }
          $csv = Get-Content "_smoke\out.csv" -Encoding UTF8
          if (-not ($csv | Where-Object { $_ -match "^time_hms,text" })) {
            Write-Error "CSV 表头不符（模板未随包？）"; exit 1
          }
          $n = ($csv | Where-Object { $_ -notmatch "^time_hms" -and $_.Trim() }).Count
          Write-Host "smoke OK: CLI CSV $n 行（内容可为空——冒烟只验产物可运行）"

      - name: Smoke check GUI exe (offscreen, launches without crashing)
        # 上一步只验了 CLI 走到的共享 _internal；GUI 侧另有 Qt/qfluentwidgets
        # 专属载荷（GUI exe 的 PYZ 与 Qt 插件），剪枝误删或 hook 漏收会让
        # GUI 启动即崩——单独验一次启动存活。
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\VideoSubtitleExtractor\VideoSubtitleExtractor.exe" `
            -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Error "frozen GUI 启动即退出（exit $($p.ExitCode)）——Qt 载荷或 hook 缺失"
            exit 1
          }
          Write-Host "smoke OK: GUI 启动后存活（PID $($p.Id)）"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue

      - name: Package release archive (7z, max compression)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $sz = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sz)) { Write-Error "7-Zip 未找到"; exit 1 }
          Push-Location "dist/VideoSubtitleExtractor"
          try {
            & $sz a -t7z -mx=9 -m0=LZMA2 -mmt=on "..\..\VideoSubtitleExtractor.$ver.7z" "*"
            if ($LASTEXITCODE -ne 0) { throw "7z 打包失败" }
          } finally { Pop-Location }
          $sl = & $sz l -slt "VideoSubtitleExtractor.$ver.7z"
          $paths = $sl | Where-Object { $_ -match "^Path = " } | ForEach-Object { ($_ -replace "^Path = ", "").Trim() }
          $hasRootExe = $paths -contains "VideoSubtitleExtractor.exe"
          $hasCliExe = $paths -contains "subtitle-extract.exe"
          $hasInternal = [bool]($paths | Where-Object { $_ -like "_internal\*" -or $_ -like "_internal/*" })
          if (-not $hasRootExe -or -not $hasCliExe -or -not $hasInternal) {
            Write-Error "7z 布局不符：需 VideoSubtitleExtractor.exe（GUI）+ subtitle-extract.exe（CLI）位于根 + _internal/（与 dist 一致）"
            exit 1
          }
          Write-Host "archive ready: VideoSubtitleExtractor.$ver.7z"

      - name: Create tag + push
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$ver"
          git push origin "v$ver"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "tag v$ver pushed"

      - name: Generate release notes
        id: notes
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $escaped = $ver -replace '\.', '\.'
          $notes = [System.IO.File]::ReadAllText((Resolve-Path "release_notes.md"))
          $m = [regex]::Match($notes, "(?ms)^## v$escaped(.*?)(?=^## v\d|\z)")
          if (-not $m.Success) { Write-Error "release_notes.md 中未找到 v$ver 节"; exit 1 }
          $body = ("## v$ver" + $m.Groups[1].Value).TrimEnd()
          if ($body -match "### 待补充") {
            Write-Error "release_notes.md 的 v$ver 节还是骨架（### 待补充）"
            exit 1
          }
          $sha = (git rev-parse --short HEAD).Trim()
          $body += "`n`n---`n构建源: ${{ inputs.ref }} @ $sha（GitHub Actions 自动构建，7-Zip 最大压缩）"
          [System.IO.File]::WriteAllText("notes.md", $body, (New-Object System.Text.UTF8Encoding($false)))

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" "VideoSubtitleExtractor.${{ steps.ver.outputs.version }}.7z" `
            --title "v${{ steps.ver.outputs.version }}" `
            --notes-file notes.md
