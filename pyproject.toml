[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-subtitle-extractor"
version = "0.2.0"
description = "从视频固定区域提取字幕/文本：CLI + GUI（PySide6 + qfluentwidgets），基于 video_ocr_engine，输出 时间戳+原始文本 CSV（支持分频采样）。"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2",                       # 经引擎（third_party/video_ocr_engine submodule）间接需要
    "PySide6-Essentials>=6.11",       # Qt 6 GUI（qfluentwidgets 依赖；装后移除 PySide6-Addons 省 ~400MB）
    "PySide6-Fluent-Widgets>=1.11",   # Fluent 组件库（GPLv3，故本仓库为 GPLv3）
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]  # 一键构建 frozen exe（scripts/build_exe.ps1）
# TRT（可选）：thin binding 只装 cuda-python + tensorrt 纯 Python 绑定层，
# 实际推理 DLL 由引擎从本地 PATH 中的 CUDA/TensorRT 加载；无 TRT 自动回退 ONNX。
# 用 scripts/setup.ps1（默认装）或 `pip install -e ".[trt]"` 安装。
trt = [
    "cuda-python",
    # thin bindings：不装 tensorrt 元包（~2.2GB）。CUDA 13 绑定，见 tensorrt.py shim。
    "tensorrt_cu13_bindings>=11,<12",
]

[project.scripts]
subtitle-extract = "subtitle_extract_cli:main"
subtitle-extract-gui = "gui:main"

[tool.setuptools]
py-modules = [
    "app_config",
    "engine_bootstrap",
    "extract_worker",
    "gui",
    "gui_settings",
    "gui_video",
    "preview_widget",
    "subtitle_extract_cli",
    "tensorrt",
    "theme_manager",
    "widget_utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
