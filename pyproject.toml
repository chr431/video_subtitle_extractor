[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video-subtitle-extractor"
version = "0.2.2"
description = "从视频固定区域提取字幕/文本：CLI + GUI（PySide6 + qfluentwidgets），基于 video_ocr_engine，输出 时间戳+原始文本 CSV（支持分频采样）。"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2",                       # 经引擎间接需要
    "PySide6-Essentials>=6.11",       # Qt 6 GUI（qfluentwidgets 依赖；装后移除 PySide6-Addons 省 ~400MB）
    "PySide6-Fluent-Widgets>=1.11",   # Fluent 组件库（GPLv3，故本仓库为 GPLv3）
    # decord 解码 fork（chr431）——**解码必需**，PyPI 官方版不支持本项目用到的
    # next_roi / ROI-first / hybrid ctx。按 PEP 508 直接 URL 锁 wheel（与
    # RaceVideoToLog 同一做法）：版本单一事实源在此，setup.ps1 不再手写版本号
    # 与解压逻辑。
    # ⚠️ 下限 0.8.4：`--decode-backend hybrid` 走 decord 原生 hybrid ctx
    # （decord.hybrid / decord.hybrid_gpu），0.7.x 没有该 ctx，引擎会**静默
    # 回退纯 GPU**（实测 0.7.12 下 CLI 打 [decord/GPU]，0.8.4 下才是
    # [decord/hybrid]）；0.8.3 起 hybrid 为包缓存 + 供料期 GOP 派工。
    "decord @ https://github.com/chr431/decord/releases/download/v0.8.4/decord-0.8.4-cp311-cp311-win_amd64.whl ; python_version == '3.11'",
    "decord @ https://github.com/chr431/decord/releases/download/v0.8.4/decord-0.8.4-cp312-cp312-win_amd64.whl ; python_version == '3.12'",
    "decord @ https://github.com/chr431/decord/releases/download/v0.8.4/decord-0.8.4-cp313-cp313-win_amd64.whl ; python_version == '3.13'",
    "decord @ https://github.com/chr431/decord/releases/download/v0.8.4/decord-0.8.4-cp314-cp314-win_amd64.whl ; python_version == '3.14'",
    # ── 引擎（chr431/video_ocr_engine）──
    # 2026-08-30 起由 git submodule 改为 pip 依赖 + git tag 锁定（与
    # RaceVideoToLog 同一改造）。submodule 的问题：detached HEAD 可本地提交
    # 不被告警、.pth 硬编码绝对路径换机即废、版本推进无约束。
    # 本地开发改引擎：`pip install -e <引擎源码树>` 覆盖（setup.ps1 自动做）。
    "video-ocr-engine @ git+https://github.com/chr431/video_ocr_engine.git@v0.14.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]  # 一键构建 frozen exe（scripts/build_exe.ps1）
# TRT（可选）：thin binding 只装 cuda-python + tensorrt 纯 Python 绑定层，
# 实际推理 DLL 由引擎从本地 PATH 中的 CUDA/TensorRT 加载；无 TRT 自动回退 ONNX。
# 用 scripts/setup.ps1（默认装）或 `pip install -e ".[trt]"` 安装。
trt = [
    "cuda-python",
    # thin bindings：不装 tensorrt 元包（~2.2GB）。CUDA 13 绑定，见 tensorrt.py shim。
    "tensorrt_cu13_bindings>=11,<12",
]

[project.scripts]
subtitle-extract = "subtitle_extract_cli:main"
subtitle-extract-gui = "gui:main"

[tool.setuptools]
py-modules = [
    "app_config",
    "extract_worker",
    "gui",
    "gui_settings",
    "gui_video",
    "preview_widget",
    "subtitle_extract_cli",
    "tensorrt",
    "theme_manager",
    "video_utils_app",
    "widget_utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
